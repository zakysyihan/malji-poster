<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1587, initial-scale=1.0">
    <title>Poster Jadwal Kajian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1587px;
            height: 2245px;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
            background-image: url('{{ background_url }}');
            background-size: cover;
            background-position: center;
        }

        /* ===== DATE POSITIONING ===== */
        .date-container {
            position: absolute;
            top: 410px; /* Shifted down to prevent overlap with the yellow box */
            left: 85px; /* Shifted right to perfectly align with the text above */
            z-index: 10;
        }

        .header-date {
            color: #ffffff;
            font-size: 28px; /* Increased font size slightly */
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        /* ===== TABLE CONTAINER ===== */
        .table-area {
            position: absolute;
            top: 485px;    /* Start of empty blue area */
            bottom: 355px; /* End of empty blue area */
            left: 20px;
            right: 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: transparent;
        }

        th {
            background: #1a3a6b;
            color: #ffffff;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: 1px;
            padding: 20px 10px;
            border: 3px solid #0f2647;
            text-transform: uppercase;
        }

        td {
            padding: 15px 10px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            border: 3px solid #b8cce4;
            color: #1a1a2e;
            line-height: 1.35;
            word-wrap: break-word;
            background-color: #ffffff;
        }

        /* Flexible row height to fill the container */
        tr {
            height: 1%;
        }

        tr:nth-child(even) td {
            background-color: #e6eef8;
        }

        /* All specific table content font stylings have been removed to ensure complete uniformity across columns */

        /* Column Widths (Percentages to strictly fit table area) */
        .col-no { width: 5%; }
        .col-waktu { width: 13%; }
        .col-tema { width: 24%; }
        .col-pemateri { width: 28%; }
        .col-tempat { width: 22%; }
        .col-ket { width: 8%; }

    </style>
</head>
<body>
    <div class="date-container">
        <div class="header-date">{{ date }}</div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th class="col-no">No</th>
                    <th class="col-waktu">Waktu</th>
                    <th class="col-tema">Tema</th>
                    <th class="col-pemateri">Pemateri</th>
                    <th class="col-tempat">Tempat</th>
                    <th class="col-ket">Ket</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in entries %}
                <tr>
                    <td>{{ entry.no }}</td>
                    <td>{{ entry.time }}</td>
                    <td class="theme-text">{{ entry.theme }}</td>
                    <td class="speaker-text">{{ entry.speaker }}</td>
                    <td class="place-text">{{ entry.place }}</td>
                    <td class="status-text">{{ entry.note }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
